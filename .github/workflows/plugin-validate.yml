# plugin-validate.yml — validates .claude-plugin/{plugin.json,marketplace.json} on every push and PR
# to THIS plugin's own repo (same "not copied into targets" scope as release.yml). Catches a broken
# manifest — the thing the community-marketplace review pipeline runs first — before it lands on a
# branch, well before a release or a marketplace submission. Pure schema/structure check: no model
# calls, no ANTHROPIC_API_KEY needed, so a standard GitHub-hosted runner is enough.

name: plugin-validate

on:
  push:
  pull_request:

concurrency:
  group: plugin-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Pinned per CLAUDE.md rule 9 (no floating `latest` for CI tooling) — bump deliberately.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Validate plugin manifest
        run: claude plugin validate . --strict
