# release.yml — tag + GitHub Release automation for THIS plugin's own repo.
#
# NOT copied into target repos by /init-repo (unlike bug-finder.yml) — this maintains bug-fixer
# itself, not something a target repo needs. Runs on a standard GitHub-hosted runner; no self-hosted
# `claude` runner or Claude Code CLI required, since it only reads plugin.json/CHANGELOG.md and calls
# git/gh — the same steps `claude plugin tag` performs locally, automated for pushes to master.
#
# Trigger: a push to master that changes .claude-plugin/plugin.json (i.e. a version bump commit).
# Idempotent: skipped if the tag for the current version already exists.

name: release

on:
  push:
    branches: [master]
    paths:
      - '.claude-plugin/plugin.json'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
          if [ -z "$version" ]; then
            echo "::error::plugin.json has no version field"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=bug-fixer--v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: check
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate marketplace/plugin version agreement
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          mp_version="$(jq -r '.plugins[] | select(.name=="bug-fixer") | .version // empty' .claude-plugin/marketplace.json)"
          if [ -n "$mp_version" ] && [ "$mp_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::marketplace.json plugin entry says $mp_version but plugin.json says ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Extract CHANGELOG section for this version
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          awk -v ver="${{ steps.version.outputs.version }}" '
            /^## / {
              line = $0
              gsub(/[][]/, "", line)
              if (found) exit
              if (line ~ ("^## " ver "( |$)")) { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::no CHANGELOG.md section found for version ${{ steps.version.outputs.version }} — add one before bumping plugin.json"
            exit 1
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "bug-fixer ${{ steps.version.outputs.version }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "bug-fixer ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md
